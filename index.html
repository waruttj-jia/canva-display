<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Auto Slideshow</title>
    <style>
        /* ล้างค่าขอบเดิมของ Browser */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* ป้องกันการ Scroll */
            background-color: #000;
        }

        /* Container หลักให้เต็มหน้าจอ */
        .slideshow-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* ปรับรูปภาพให้เต็มจอและคงสัดส่วน (Cover) */
        .mySlides {
            display: none;
            width: 100%;
            height: 100%;
        }

        .mySlides img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* สำคัญ: ทำให้รูปเต็มจอโดยไม่เสียสัดส่วน */
            object-position: center;
        }

        /* ข้อความด้านบน (Optional) */
        .text {
            color: #f2f2f2;
            font-size: 24px;
            padding: 8px 12px;
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-family: sans-serif;
            z-index: 10;
        }

        /* เอฟเฟกต์การเปลี่ยนภาพแบบละมุน (Fade) */
        .fade {
            animation-name: fade;
            animation-duration: 2s;
        }

        @keyframes fade {
            from { opacity: 0.3 } 
            to { opacity: 1 }
        }
    </style>
</head>
<body>

<div class="slideshow-container" id="slideshow">
    </div>

<script>
    const slideshowContainer = document.getElementById('slideshow');
    const totalImages = 20; // ตั้งเผื่อไว้ได้เลย
    const folderName = 'images';
    const fileExtension = 'jpg';

    // 1. สร้าง HTML พร้อมระบบดักจับ Error
    for (let i = 1; i <= totalImages; i++) {
        const slideDiv = document.createElement('div');
        slideDiv.className = 'mySlides fade';
        
        const img = document.createElement('img');
        img.src = `${folderName}/${i}.${fileExtension}`;
        
        // ถ้าโหลดรูปไม่สำเร็จ (ไม่มีรูป) ให้ลบ Slide นั้นออกไปเลย
        img.onerror = function() {
            slideDiv.remove(); 
        };

        slideDiv.appendChild(img);
       
        slideshowContainer.appendChild(slideDiv);
    }

    // 2. เริ่มต้นฟังก์ชัน Slideshow (รอให้ DOM โหลดเสร็จนิดนึง)
    let slideIndex = 0;
    setTimeout(showSlides, 5000); // รอเผื่อรูปไหนโหลดไม่ได้จะได้โดนลบออกก่อน

    function showSlides() {
        let slides = document.getElementsByClassName("mySlides");
        
        // ถ้าไม่มีรูปเหลือเลยในหน้าเว็บ ไม่ต้องทำงานต่อ
        if (slides.length === 0) return; 

        for (let i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";  
        }
        
        slideIndex++;
        if (slideIndex > slides.length) {slideIndex = 1}    
        
        slides[slideIndex-1].style.display = "block";  
        setTimeout(showSlides, 15000); 
    }
    <style>
    /* ...โค้ดเดิมของคุณ... */

    .scrolling-text {
        position: absolute;
        bottom: 0; /* วางไว้ด้านล่างสุด */
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.5); /* พื้นหลังดำจางๆ ให้ตัวหนังสืออ่านง่าย */
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        box-sizing: border-box;
        padding: 10px 0;
        z-index: 100; /* ให้อยู่เหนือรูปภาพ */
        font-family: sans-serif;
        font-size: 24px;
    }

    .scrolling-text p {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 20s linear infinite; /* ปรับ 20s ให้ช้าหรือเร็วตามชอบ */
    }

    @keyframes marquee {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-100%, 0); }
    }
</style>

<div class="slideshow-container" id="slideshow">
    <div class="scrolling-text">
        <p>ยินดีต้อนรับสู่ Full Screen Slideshow — ข้อความตัววิ่งของคุณสามารถใส่ตรงนี้ได้ยาวๆ เลย — ขอบคุณที่รับชมครับ</p>
    </div>
</div>
</script>

</body>
</html>
